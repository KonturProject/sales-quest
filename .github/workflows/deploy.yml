name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # data/ by content and the hook rules over every tracked file (D-34): catches commits that
      # skipped the hook, including the admin's commits through the GitHub API.
      - run: npm run check:data
      # Always, even for data-only pushes (D-8a): a queued code push can be cancelled by a later
      # data push, and that data push then deploys the untested code.
      - run: npm test
      - run: npm run test:engine # coverage of src/engine ≥ 90 % (QA-1)
      - run: npm run build
      - run: npm run size

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # e2e and the QA-4 perf test (D-8, D-39): reported, not gating the deploy — a slow CI machine
  # must not hold back the admin's data publications.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The runner's own Google Chrome with software WebGL (playwright.config.ts).
      - run: npx playwright test

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/
          if-no-files-found: ignore

  deploy:
    needs: build
    # One deploy at a time; a newer push waits instead of cancelling the running one (DEP-2).
    # On the job, not the workflow: e2e of one push must not hold back the next (review 3a, D-39).
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Only this job gets the Pages rights; the build job (which runs npm install scripts) does not.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
